name: C Decompile
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: $HOME/.cache/ghidra
          key: ghidra-12.1.3



      - name: Install ghidra
        run: |
          mkdir -p $HOME/.cache/
          if [ ! -d $HOME/.cache/ghidra ]; then
            curl -L -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip"
            unzip ghidra.zip -d $HOME/.cache/ghidra           
            rm ghidra.zip
          fi

      - name: Check ghidra
        run: |
          du -sh $HOME/.cache/ghidra
          ls $HOME/.cache/ghidra
          find $HOME/.cache/ghidra -type f -name "analyzeHeadless" -print
          exit 1

      - name: Setup ghidra
        run: |
          chmod +x $HOME/.cache/ghidra/ghidra_12.1.3_PUBLIC/support/analyzeHeadless
          echo "$HOME/.cache/ghidra/ghidra_12.1.3_PUBLIC/support" >> "$GITHUB_PATH"

      - name: Decompile C File
        run: |
          analyzeHeadless ghidra-project PairIPCore -import src/armeabi-v7a/libpairipcore.so -scriptPath scripts -postScript ghidra_decompile.java native-src/armeabi-v7a/libpairipcore.c -deleteProject
        
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update files" || exit 0
          git push