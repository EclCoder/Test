name: Mod APK with Morphe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Morphe Desktop
        run: |
          wget -O morphe.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/v1.15.0/morphe-desktop-1.15.0-all.jar"

      - name: Download Morphe patches
        run: |
          wget -O patches.mpp "https://github.com/sjshb57/Pairip-Patches/releases/download/v1.10.3/patches-1.10.3.mpp"

      - name: Mod apk
        run: |
          mkdir -p azrecordermod        
          java -jar morphe.jar patch --patches=patches.mpp -e="Remove pairip protection" -o=azrecordermod/basemod.apk azrecorder/base.apk

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update files" || exit 0
          git push
        