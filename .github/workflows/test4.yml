name: Download AZ Screen Recorder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache AZ Screen Recorder
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-uptodown-6.9.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed python3

      - name: Download from Uptodown
        shell: bash
        run: |
          set -e

          CACHE_DIR="$HOME/.cache/azrecorder"
          mkdir -p "$CACHE_DIR"

          if compgen -G "$CACHE_DIR/*" > /dev/null; then
            echo "Using cached file:"
            ls -lh "$CACHE_DIR"
            exit 0
          fi

          PAGE="https://az-screen-recorder.en.uptodown.com/android/download/1208463249-x"

          echo "Fetching:"
          echo "$PAGE"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -A "Mozilla/5.0 (Linux; Android 11; Mobile) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            "$PAGE" \
            -o page.html

          echo
          echo "Page size:"
          wc -c page.html

          echo
          echo "Searching for download URLs..."

          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote

          html = Path("page.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # Decode escaped URLs commonly found in JS/HTML.
          html = html.replace("\\/", "/")
          html = html.replace("\\u0026", "&")
          html = html.replace("&amp;", "&")

          patterns = [
              r'https?://[^"\'<> ]+',
              r'https?:\\\\/\\\\/[^"\'<> ]+',
          ]

          urls = set()

          for pattern in patterns:
              for x in re.findall(pattern, html):
                  x = x.replace("\\/", "/")
                  x = unquote(x)
                  urls.add(x)

          print("Found URLs:", len(urls))

          candidates = []

          for url in urls:
              low = url.lower()

              if (
                  "uptodown" in low
                  and (
                      ".apk" in low
                      or ".xapk" in low
                      or "/dwn/" in low
                      or "download" in low
                  )
              ):
                  candidates.append(url)

          print()
          print("Possible download URLs:")

          for url in candidates:
              print(url)

          # Save candidates for bash.
          Path("urls.txt").write_text(
              "\n".join(candidates)
          )
          PY

          if [ ! -s urls.txt ]; then
            echo
            echo "No download URL found in HTML."
            echo
            echo "First 200 lines containing download-related text:"
            grep -Ein \
              'download|\.apk|\.xapk|dw\.uptodown|file_url|download_url' \
              page.html \
              | head -200 || true

            exit 1
          fi

          echo
          echo "Trying candidate URLs..."

          SUCCESS=0

          while IFS= read -r URL; do

            [ -z "$URL" ] && continue

            echo
            echo "Trying:"
            echo "$URL"

            if curl \
              -L \
              --fail \
              --retry 3 \
              --retry-delay 2 \
              -A "Mozilla/5.0 (Linux; Android 11; Mobile)" \
              "$URL" \
              -o "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"; then

              SIZE=$(stat -c%s \
                "$CACHE_DIR/az-screen-recorder-6.9.10.xapk")

              echo
              echo "Downloaded $SIZE bytes"

              # Reject obvious HTML error pages.
              FILE_TYPE=$(file -b \
                "$CACHE_DIR/az-screen-recorder-6.9.10.xapk")

              echo "File type: $FILE_TYPE"

              if [[ "$FILE_TYPE" != *"HTML"* ]] && [ "$SIZE" -gt 100000 ]; then
                SUCCESS=1
                break
              fi

              rm -f \
                "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"
            fi

          done < urls.txt

          if [ "$SUCCESS" -ne 1 ]; then
            echo
            echo "Could not download the APK/XAPK."
            exit 1
          fi

          echo
          echo "=== Downloaded file ==="
          ls -lh "$CACHE_DIR"

          file "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

      - name: Copy to repository
        run: |
          mkdir -p azrecorder

          cp \
            "$HOME/.cache/azrecorder/"* \
            azrecorder/

          echo "=== Repository ==="
          ls -lh azrecorder/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add azrecorder/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Add AZ Screen Recorder 6.9.10"
          git push