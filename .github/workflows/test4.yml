name: Download AZ Screen Recorder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache AZ Screen Recorder
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-uptodown-6.9.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3

      - name: Download AZ Screen Recorder 6.9.10
        shell: bash
        run: |
          set -e

          CACHE_DIR="$HOME/.cache/azrecorder"
          mkdir -p "$CACHE_DIR"

          if compgen -G "$CACHE_DIR/*" > /dev/null; then
            echo "Using cached file:"
            ls -lh "$CACHE_DIR"
            exit 0
          fi

          APP_URL="https://az-screen-recorder.en.uptodown.com/android"
          DOWNLOAD_PAGE="https://az-screen-recorder.en.uptodown.com/android/download/1208463249-x"
          VERSION="6.9.10"

          UA="Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36"

          echo "Getting app page..."

          curl -L --fail --retry 5 \
            -A "$UA" \
            "$APP_URL" \
            -o app.html

          echo "Extracting Uptodown data-code..."

          APP_CODE=$(python3 - <<'PY'
          import re

          html = open("app.html", encoding="utf-8", errors="ignore").read()

          patterns = [
              r'id="detail-app-name"[^>]*data-code="([^"]+)"',
              r'id="detail-app-name"[^>]*code="([^"]+)"',
          ]

          for p in patterns:
              m = re.search(p, html)

              if m:
                  print(m.group(1))
                  break
          else:
              raise SystemExit("Could not find data-code")
          PY
          )

          echo "App code: $APP_CODE"

          VERSION_JSON=""

          for i in $(seq 1 20); do
            echo
            echo "Checking Uptodown version page $i..."

            URL="$APP_URL/apps/$APP_CODE/versions/$i"

            RESPONSE=$(curl -L --fail --retry 3 \
              -A "$UA" \
              "$URL")

            FOUND=$(echo "$RESPONSE" | jq -r \
              --arg VERSION "$VERSION" \
              '.data[]? | select(.version == $VERSION) | @json' \
              | head -1 || true)

            if [ -n "$FOUND" ]; then
              echo "Found version $VERSION"

              echo "$FOUND" | jq .

              VERSION_URL=$(echo "$FOUND" | jq -r '.versionURL.url')
              EXTRA_URL=$(echo "$FOUND" | jq -r '.versionURL.extraURL')
              VERSION_ID=$(echo "$FOUND" | jq -r '.versionURL.versionID')

              VERSION_PAGE="$VERSION_URL/$EXTRA_URL/$VERSION_ID"

              echo
              echo "Version page:"
              echo "$VERSION_PAGE"

              break
            fi
          done

          if [ -z "${VERSION_PAGE:-}" ]; then
            echo "Version $VERSION was not found"
            exit 1
          fi

          echo
          echo "Getting version page..."

          curl -L --fail --retry 5 \
            -A "$UA" \
            "$VERSION_PAGE" \
            -o version.html

          DATA_VERSION=$(python3 - <<'PY'
          import re

          html = open(
              "version.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          patterns = [
              r'class="button variants"[^>]*data-version="([^"]+)"',
              r'data-version="([^"]+)"[^>]*class="button variants"',
          ]

          for p in patterns:
              m = re.search(p, html)

              if m:
                  print(m.group(1))
                  break
          else:
              raise SystemExit("Could not find data-version")
          PY
          )

          echo "data-version: $DATA_VERSION"

          echo
          echo "Getting files..."

          FILES_URL="$APP_URL/../app/$APP_CODE/version/$DATA_VERSION/files"

          echo "Files URL:"
          echo "$FILES_URL"

          FILES_RESPONSE=$(curl -L --fail --retry 5 \
            -A "$UA" \
            "$FILES_URL")

          echo "$FILES_RESPONSE" | jq .

          FILE_ID=$(echo "$FILES_RESPONSE" |
            jq -r '
              .content |
              capture("data-file-id=\"(?<id>[^\"]+)\"").id
            ' 2>/dev/null || true)

          if [ -z "$FILE_ID" ] || [ "$FILE_ID" = "null" ]; then
            echo "Could not find file ID automatically."

            echo
            echo "Searching file IDs..."

            FILE_ID=$(echo "$FILES_RESPONSE" |
              grep -oE 'data-file-id="[^"]+"' |
              head -1 |
              sed 's/.*="//;s/"$//')
          fi

          if [ -z "$FILE_ID" ]; then
            echo "No file ID found"
            exit 1
          fi

          echo
          echo "File ID: $FILE_ID"

          FINAL_PAGE="$APP_URL/download/${FILE_ID}-x"

          echo
          echo "Final download page:"
          echo "$FINAL_PAGE"

          curl -L --fail --retry 5 \
            -A "$UA" \
            "$FINAL_PAGE" \
            -o final.html

          DATA_URL=$(python3 - <<'PY'
          import re

          html = open(
              "final.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          patterns = [
              r'id="detail-download-button"[^>]*data-url="([^"]+)"',
              r'data-url="([^"]+)"[^>]*id="detail-download-button"',
          ]

          for p in patterns:
              m = re.search(p, html)

              if m:
                  print(m.group(1))
                  break
          else:
              raise SystemExit(
                  "Could not find detail-download-button data-url"
              )
          PY
          )

          echo
          echo "Download token obtained."

          DOWNLOAD_URL="https://dw.uptodown.com/dwn/$DATA_URL"

          echo "Downloading from Uptodown CDN..."

          curl -L --fail --retry 5 \
            -A "$UA" \
            "$DOWNLOAD_URL" \
            -o "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

          SIZE=$(stat -c%s \
            "$CACHE_DIR/az-screen-recorder-6.9.10.xapk")

          echo
          echo "Downloaded:"
          ls -lh "$CACHE_DIR"

          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloaded file is suspiciously small."
            file "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"
            exit 1
          fi

          file "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

      - name: Copy to repository
        run: |
          mkdir -p azrecorder

          cp "$HOME/.cache/azrecorder/"* \
            azrecorder/

          ls -lh azrecorder/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add azrecorder/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Add AZ Screen Recorder 6.9.10"
          git push