name: Download AZ Screen Recorder

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  download-az:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache AZ Screen Recorder
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-uptodown-6.9.10-1208463249

      - name: Setup environment
        run: |
          echo "CACHE_DIR=/home/runner/.cache/azrecorder" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3

      - name: Download AZ Screen Recorder
        run: |
          set -e

          APP_URL="https://az-screen-recorder.en.uptodown.com/android"
          VERSION="6.9.10"
          EXPECTED_FILE_ID="1208463249"

          mkdir -p "$CACHE_DIR"

          echo "Checking cache..."

          if compgen -G "$CACHE_DIR/*.xapk" > /dev/null; then
            echo "XAPK already exists in cache:"
            ls -lh "$CACHE_DIR"
            exit 0
          fi

          # --------------------------------------------------
          # 1. Get app page
          # --------------------------------------------------

          echo
          echo "Getting app page..."

          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            "$APP_URL" \
            -o app.html

          # --------------------------------------------------
          # 2. Extract Uptodown app code
          # --------------------------------------------------

          echo
          echo "Extracting Uptodown data-code..."

          APP_CODE=$(python3 - <<'PY'
          import re

          html = open(
              "app.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          patterns = [
              r'id=["\']detail-app-name["\'][^>]*data-code=["\']([^"\']+)',
              r'data-code=["\']([^"\']+)["\'][^>]*id=["\']detail-app-name["\']',
          ]

          for pattern in patterns:
              m = re.search(pattern, html, re.I | re.S)
              if m:
                  print(m.group(1))
                  break
          PY
          )

          if [ -z "$APP_CODE" ]; then
            echo "ERROR: Could not find app code"
            exit 1
          fi

          echo "App code: $APP_CODE"

          # --------------------------------------------------
          # 3. Find requested version
          # --------------------------------------------------

          echo
          echo "Searching for version $VERSION..."

          VERSION_JSON=""

          for i in $(seq 1 20); do

            echo "Checking Uptodown version page $i..."

            URL="$APP_URL/apps/$APP_CODE/versions/$i"

            RESP=$(curl -L --fail --retry 3 \
              -A 'Mozilla/5.0' \
              "$URL" 2>/dev/null || true)

            if [ -z "$RESP" ]; then
              continue
            fi

            FOUND=$(echo "$RESP" | jq -c \
              --arg version "$VERSION" \
              '.data[]? | select(.version == $version)' \
              2>/dev/null | head -n 1 || true)

            if [ -n "$FOUND" ]; then
              VERSION_JSON="$FOUND"

              echo "Found version $VERSION"
              echo "$FOUND" | jq .

              break
            fi

          done

          if [ -z "$VERSION_JSON" ]; then
            echo "ERROR: Version $VERSION not found"
            exit 1
          fi

          # --------------------------------------------------
          # 4. Get file ID DIRECTLY from version JSON
          # --------------------------------------------------

          FILE_ID=$(echo "$VERSION_JSON" | jq -r '.fileID')

          echo
          echo "File ID from version API: $FILE_ID"

          if [ "$FILE_ID" != "$EXPECTED_FILE_ID" ]; then
            echo "ERROR: Unexpected file ID"
            echo "Expected: $EXPECTED_FILE_ID"
            echo "Got:      $FILE_ID"
            exit 1
          fi

          echo "Correct file ID confirmed."

          # --------------------------------------------------
          # 5. Build final download page
          # --------------------------------------------------

          FINAL_PAGE="$APP_URL/download/${FILE_ID}-x"

          echo
          echo "Final download page:"
          echo "$FINAL_PAGE"

          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            "$FINAL_PAGE" \
            -o final.html

          # --------------------------------------------------
          # 6. Extract data-url
          # --------------------------------------------------

          echo
          echo "Extracting download data-url..."

          DATA_URL=$(python3 - <<'PY'
          import re

          html = open(
              "final.html",
              encoding="utf-8",
              errors="ignore"
          ).read()

          patterns = [
              # Normal button
              r'id=["\']detail-download-button["\'][^>]*data-url=["\']([^"\']+)',

              # Attribute order reversed
              r'data-url=["\']([^"\']+)["\'][^>]*id=["\']detail-download-button["\']',

              # Generic data-url fallback
              r'data-url=["\']([^"\']{20,})["\']',
          ]

          for pattern in patterns:
              m = re.search(pattern, html, re.I | re.S)

              if m:
                  value = m.group(1)

                  # Ignore obviously unrelated data-url values
                  if value.startswith("http") or len(value) > 20:
                      print(value)
                      break
          PY
          )

          if [ -z "$DATA_URL" ]; then

            echo "ERROR: Could not find download data-url"

            echo
            echo "Searching final HTML..."

            grep -i -C 8 \
              -E 'detail-download-button|data-button-id|data-url|dw\.uptodown' \
              final.html | head -200 || true

            exit 1
          fi

          echo
          echo "data-url found:"
          echo "$DATA_URL"

          # --------------------------------------------------
          # 7. Build CDN URL
          # --------------------------------------------------

          DOWNLOAD_URL="https://dw.uptodown.com/dwn/$DATA_URL"

          echo
          echo "CDN download URL:"
          echo "$DOWNLOAD_URL"

          # --------------------------------------------------
          # 8. Download XAPK
          # --------------------------------------------------

          TEMP_FILE="az-screen-recorder-6.9.10.xapk"

          echo
          echo "Downloading XAPK..."

          curl -L --fail --retry 5 \
            -A 'Mozilla/5.0' \
            "$DOWNLOAD_URL" \
            -o "$TEMP_FILE"

          # --------------------------------------------------
          # 9. Verify file
          # --------------------------------------------------

          echo
          echo "Downloaded file:"

          ls -lh "$TEMP_FILE"
          file "$TEMP_FILE"

          FILE_SIZE=$(stat -c%s "$TEMP_FILE")

          echo
          echo "File size: $FILE_SIZE bytes"

          # 1 MB minimum sanity check
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Downloaded file is suspiciously small."
            exit 1
          fi

          if file "$TEMP_FILE" | grep -qiE 'HTML|text'; then
            echo "ERROR: Downloaded file appears to be HTML."
            exit 1
          fi

          # --------------------------------------------------
          # 10. Put into cache
          # --------------------------------------------------

          mv "$TEMP_FILE" \
            "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

          echo
          echo "Successfully cached:"

          ls -lh "$CACHE_DIR"

      - name: Copy XAPK to repository
        run: |
          set -e

          mkdir -p azrecorder

          cp \
            "$CACHE_DIR/az-screen-recorder-6.9.10.xapk" \
            azrecorder/az-screen-recorder-6.9.10.xapk

          echo "Repository file:"
          ls -lh azrecorder/

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add azrecorder/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AZ Screen Recorder 6.9.10"

          git push