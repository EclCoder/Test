name: Download AZ Screen Recorder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Uptodown file
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-uptodown-6.9.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Setup
        run: |
          mkdir -p "$HOME/.cache/azrecorder"

      - name: Download AZ Screen Recorder 6.9.10
        shell: bash
        run: |
          set -e

          CACHE_DIR="$HOME/.cache/azrecorder"

          if compgen -G "$CACHE_DIR/*" > /dev/null; then
            echo "Using cached file:"
            ls -lh "$CACHE_DIR"
            exit 0
          fi

          BASE="https://az-screen-recorder.en.uptodown.com/android"

          echo "Getting version information..."

          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            "$BASE/versions" \
            -o versions.html

          echo "Searching for version 6.9.10..."

          DOWNLOAD_PATH=$(
            grep -F '6.9.10</span>' versions.html |
            head -1 |
            sed -n 's/.*data-url="[^"]*download\/\([^"]*\)".*/\1/p'
          )

          if [ -z "$DOWNLOAD_PATH" ]; then
            echo "Could not find version 6.9.10"
            exit 1
          fi

          echo "Download path: $DOWNLOAD_PATH"

          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            "$BASE/download/$DOWNLOAD_PATH" \
            -o download.html

          DATA_URL=$(
            grep -o 'class="post-download"[^>]*data-url="[^"]*"' download.html |
            sed -n 's/.*data-url="\([^"]*\)".*/\1/p' |
            head -1
          )

          if [ -z "$DATA_URL" ]; then
            echo "Could not obtain CDN download URL"
            exit 1
          fi

          echo "Obtained download URL"

          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            "https://dw.uptodown.com/dwn/$DATA_URL" \
            -o "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

          echo "Downloaded:"
          ls -lh "$CACHE_DIR"

          file "$CACHE_DIR/az-screen-recorder-6.9.10.xapk"

      - name: Copy to repository
        run: |
          mkdir -p azrecorder

          cp \
            "$HOME/.cache/azrecorder/az-screen-recorder-6.9.10.xapk" \
            azrecorder/

          ls -lh azrecorder/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add azrecorder/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Add AZ Screen Recorder 6.9.10"
          git push