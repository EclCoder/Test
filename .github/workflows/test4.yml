name: Test 4
on:
  push:
permissions:
  actions: read
  contents: write
jobs:
  test4:
    runs-on: ubuntu-latest
    steps:
      - name: Cache apk
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-6.9.10

      - name: Setup env
        run: |
          echo "CACHE_DIR=/home/runner/.cache/azrecorder" >> "$GITHUB_ENV"

      - name: Install apk
        run: |
          if [ ! -d "$CACHE_DIR" ]; then
            curl -L -o az.zip "https://www.apkmirror.com/apk/az-screen-recorder/az-screen-recorder-no-root/screen-recorder-az-recorder-6-9-10-release/screen-recorder-az-recorder-6-9-10-android-apk-download/download/?key=f116c31624bfc68513dfded73d21e7177cccffa2"
            mkdir -p "$CACHE_DIR"
            file az.zip
            du -sh az.zip
            unzip az.zip
            unzip *.apkm -d "$CACHE_DIR"
            rm -rf az.zip *.apkm
          fi

      - name: Verify
        run: |
          du -sh "$CACHE_DIR"
         
         