name: Download AZ Screen Recorder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache AZ Screen Recorder
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/azrecorder
          key: azrecorder-uptodown-6.9.10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install justapk
        run: |
          python -m pip install --upgrade pip
          pip install justapk

      - name: Download AZ Screen Recorder
        run: |
          CACHE_DIR="$HOME/.cache/azrecorder"
          mkdir -p "$CACHE_DIR"

          if compgen -G "$CACHE_DIR/*" > /dev/null; then
            echo "Using cached file:"
            ls -lh "$CACHE_DIR"
          else
            justapk download \
              com.hecorat.screenrecorder.free \
              -s uptodown \
              -v 6.9.10 \
              -o "$CACHE_DIR" \
              --no-convert

            echo "Downloaded:"
            ls -lh "$CACHE_DIR"
          fi

      - name: Copy to repository
        run: |
          mkdir -p azrecorder

          cp "$HOME/.cache/azrecorder/"* azrecorder/

          ls -lh azrecorder/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add azrecorder/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Add AZ Screen Recorder 6.9.10"
          git push