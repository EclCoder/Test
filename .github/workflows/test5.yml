name: Android Emulator Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
          key: android-emulator-api36-${{ runner.os }}-${{ runner.arch }}

      - name: Install Emulator
        run: |
          yes | sdkmanager --license || true
          sdkmanager \
            "emulator" \
            "platform-tools" \
            "system-images;android-36;google_apis_playstore;x86_64"

      - name: Save Cache
        if:  steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
          key: android-emulator-api36-${{ runner.os }}-${{ runner.arch }}

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n android36 \
            -k "system-images;android-36;google_apis_playstore;x86_64" \
            --force

      - name: Start Emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd android36 \
          -no-window \
          -no-audio \
          -no-snapshot \
          -gpu swiftshader_indirect > emulator.log 2>&1 &

          "ANDROID_HOME/platform-tools/adb" wait-for-device

          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            sleep 5
          done

      - name: Install APK
        run: |
          cd azrecorder
          adb install-multiple -i com.android.vending base.apk *.x86_64.apk *.en.apk *dpi.apk
          cd ..
          