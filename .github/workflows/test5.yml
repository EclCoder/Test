name: Android Emulator Test & Trace PairIP DEX

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Setup Python & Frida Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils python3-pip
          pip install frida-tools

      - name: Install Split APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -no-audio -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb root
            sleep 2
            cd azrecorder && adb install-multiple -i com.android.vending base.apk split_config.x86_64.apk split_config.en.apk $(ls split_config.*dpi.apk 2>/dev/null) && cd ..

      - name: Trace DEX & Dump Memory
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -no-audio -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb root
            sleep 2
            curl -L "https://github.com/frida/frida/releases/download/16.5.9/frida-server-16.5.9-android-x86_64.xz" | xz -dc | adb shell "cat > /data/local/tmp/frida-server"
            adb shell "chmod 755 /data/local/tmp/frida-server"
            adb shell "/data/local/tmp/frida-server &"
            sleep 3
            adb logcat -c
            frida -U -f com.hecorat.screenrecorder.free -l scripts/trace_pairip_advanced.js &
            sleep 30
            mkdir -p dumped_dex
            adb shell "ls /data/local/tmp/pairip_dump_*.dex" | while read file; do file=$(echo $file | tr -d '\r'); adb pull "$file" ./dumped_dex/; done

      - name: Upload Unpacked DEX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pairip-unpacked-dex
          path: dumped_dex/

      - name: Commit and push
        if: false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update DEX trace logs and dumped files" || exit 0
          git push
