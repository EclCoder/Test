name: Android Emulator Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Emulator Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Install Emulator
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "emulator" \
            "platform-tools" \
            "system-images;android-36;google_apis_playstore;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n android36 \
            -k "system-images;android-36;google_apis_playstore;x86_64" \
            --force

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      - name: Check Emulator
        run: |
          echo "=== Emulator ==="
          "$ANDROID_HOME/emulator/emulator" -version

          echo "=== ADB ==="
          "$ANDROID_HOME/platform-tools/adb" version

          echo "=== AVD ==="
          avdmanager list avd

          echo "=== System Image ==="
          sdkmanager --list_installed | grep "system-images;android-36"

          echo "=== KVM ==="
          ls -l /dev/kvm || true
          [[ -r /dev/kvm && -w /dev/kvm ]] && echo "KVM: OK" || echo "KVM: NOT AVAILABLE"

      
      - name: Start Emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
          -avd android36 \
          -no-window \
          -no-audio \
          -no-snapshot \
          -gpu swiftshader_indirect \
          > emulator.log 2>&1 &

          echo "Waiting for ADB..."
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device

          echo "Waiting for Android to boot..."
          timeout 180 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '

          echo "=== Emulator booted ==="
          adb devices -l

      - name: Install APK
       
        run: |
          cd azrecorder
          "$ANDROID_HOME/platform-tools/adb" install-multiple \
            -i com.android.vending \
            base.apk \
            *.x86_64.apk \
            *.en.apk \
            *dpi.apk