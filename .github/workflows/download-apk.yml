name: Download and Split PvZ2 APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          curl -fL --retry 3 \
            "https://appteka.store/download/294579/com.trans.PvZ2PAKTV_1.1.5_2.apk?e=1792964974&s=FQ5qtTBl9kHyV9L2AI3nvA" \
            -o "PvZ2PAKTV_1.1.5_2.apk"

      - name: Split APK into 50MB parts
        run: |
          mkdir -p split_apk

          split -b 50M \
            -d \
            -a 3 \
            "PvZ2PAKTV_1.1.5_2.apk" \
            "split_apk/part_"

          ls -lh split_apk/

      - name: Upload split files to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZ2PAKTV-Splitted
          path: split_apk/part_*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0