name: Decompile APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: $HOME/.cache/tools
          key: android-tools

      - name: Install tools
        run: |
          mkdir -p $HOME/.cache/tools/
          if [ ! -d $HOME/.cache/tools/jadx ]; then
            curl -L -o jadx.zip "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip"
            unzip jadx.zip -d $HOME/.cache/tools/jadx
            rm jadx.zip
          fi

          if [ ! -d $HOME/.cache/tools/apktool ]; then
            mkdir -p $HOME/.cache/tools/apktool
            curl -L -o $HOME/.cache/tools/apktool/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
            echo 'exec java -jar "$(dirname "$0")/apktool.jar" "$@"' > $HOME/.cache/tools/apktool/apktool
          fi

      - name: Setup tools
        run: |
          chmod +x $HOME/.cache/tools/jadx/bin/jadx
          echo "$HOME/.cache/tools/jadx/bin" >> "$GITHUB_PATH"
          chmod +x $HOME/.cache/tools/apktool/apktool
          echo "$HOME/.cache/tools/apktool" >> "$GITHUB_PATH"

      - name: Install apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o file.zip "https://api.github.com/repos/EclCoder/Test/actions/artifacts/9899830069/zip"
          unzip file.zip
          unzip *.apkm
          rm -rf file.zip *.apkm

      - name: Decompile
        run: |
          chmod +x scripts/decompile.sh
          scripts/decompile.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update files" || exit 0
          git push