name: Decompile APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tools
          key: tools

      - name: Install tools
        run: |
          mkdir -p ~/.cache/tools/
          if [ ! -d ~/.cache/tools/jadx ]; then
            curl -L -o jadx.zip "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip"
            unzip jadx.zip -d ~/.cache/tools
            chmod +x ~/.cache/tools/jadx/bin/jadx
            echo "~/.cache/tools/jadx/bin" >> "$GITHUB_PATH"
            rm jadx.zip
          fi

          if [ ! -d ~/.cache/tools/apktool ]; then
            mkdir -p ~/.cache/tools/apktool
            curl -L -o ~/.cache/tools/apktool/apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
            cat > ~/.cache/tools/apktool/apktool <<'EOF' exec java -jar "$(dirname "$0")/apktool.jar" "$@"
EOF
            chmod +x ~/.cache/tools/apktool/apktool
            echo "~/.cache/tools/apktool/apktool" >> "$GITHUB_PATH"
          fi
          