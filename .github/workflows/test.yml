name: Download Uptodown

on:
  push:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Get download page
        run: |
          curl -L \
          -A "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36" \
          -o page.html \
           "https://az-screen-recorder.en.uptodown.com/android/download/1207585938-x"

      - name: Inspect download button
        run: |
          grep -o '.\{0,300\}detail-download-button.\{0,1000\}' page.html || true
          echo "=== possible download URLs ==="
          grep -Eo 'https?[^" ]+' page.html | grep -Ei 'download|dwn|xapk|apk' | head -50 || true