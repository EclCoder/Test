name: Decompile APK

on:
  push:

permissions:
  actions: read
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: az-screen-recorder
          path: input
          run-id: 33771486417
          github-token: ${{ github.token }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Install JADX
        run: |
          JADX_VERSION="1.5.3"

          wget -q \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -O jadx.zip

          mkdir -p jadx
          unzip -q jadx.zip -d jadx

      - name: Install Apktool
        run: |
          APKTOOL_VERSION="2.12.1"

          wget -q \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -O apktool.jar

      - name: Find APK
        run: |
          APK_FILE=$(find input -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "No APK file found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Extract APK bundle
        run: |
          mkdir -p extracted

          unzip -o "$APK_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -type f

      - name: Collect DEX files
        run: |
          mkdir -p dex

          find extracted \
            -type f \
            -name "*.dex" \
            -exec cp {} dex/ \;

          echo "=== DEX files ==="
          find dex -type f

          if [ -z "$(find dex -type f -name "*.dex" -print -quit)" ]; then
            echo "No DEX files found."
            exit 1
          fi

      - name: Decompile DEX with JADX
        run: |
          rm -rf decompiled-src

          mkdir -p decompiled-src

          ./jadx/bin/jadx \
            --output-dir decompiled-src \
            --show-bad-code \
            dex/*.dex

          echo "=== Java source ==="
          find decompiled-src -type f -name "*.java" | head -50

      - name: Decode resources with Apktool
        run: |
          rm -rf decoded-res

          mkdir -p decoded-res

          BASE_APK=$(find extracted -type f -name "base.apk" | head -n 1)

          if [ -z "$BASE_APK" ]; then
            echo "base.apk not found."

            BASE_APK=$(find extracted -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$BASE_APK" ]; then
            echo "No APK found inside bundle."
            exit 1
          fi

          echo "Decoding:"
          echo "$BASE_APK"

          java -jar apktool.jar d \
            "$BASE_APK" \
            -o decoded-res \
            -f \
            --no-src

      - name: Copy resources
        run: |
          rm -rf res
          mkdir -p res

          if [ -d "decoded-res/res" ]; then
            cp -a decoded-res/res/. res/
          fi

          echo "=== Resource files ==="
          find res -type f | head -50

      - name: Copy manifest
        run: |
          if [ -f "decoded-res/AndroidManifest.xml" ]; then
            cp decoded-res/AndroidManifest.xml .
          fi

      - name: Replace old source
        run: |
          rm -rf src
          mkdir -p src

          cp -a decompiled-src/. src/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src res AndroidManifest.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Decompile APK"

          git push